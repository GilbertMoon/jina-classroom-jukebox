name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://jukebox:jukebox@localhost:5432/jukebox_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: jukebox
          POSTGRES_PASSWORD: jukebox
          POSTGRES_DB: jukebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jukebox -d jukebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Seed development data
        run: python -m scripts.seed_demo

      - name: Run tests
        run: pytest
