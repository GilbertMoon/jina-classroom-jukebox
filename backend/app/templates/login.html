<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · AX2 Classroom Jukebox</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link href="{{ url_for('static', path='/styles.css') }}?v=20261105-3" rel="stylesheet">
  </head>
  <body>
    <main class="login-shell container py-5">
      <section class="login-card rounded-4 p-4 p-md-5 shadow-lg mx-auto">
        <p class="eyebrow mb-2">AX2 CLASSROOM</p>
        <h1 class="h2 fw-bold">AX2 Classroom Jukebox 로그인</h1>

        <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>
        <form id="login-form" class="mt-4" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">이메일</label>
            <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">비밀번호</label>
            <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
          <button id="login-button" class="btn btn-primary btn-lg w-100" type="submit">로그인</button>
        </form>
      </section>
    </main>
    <script src="{{ url_for('static', path='/login.js') }}" defer></script>
  </body>
</html>
