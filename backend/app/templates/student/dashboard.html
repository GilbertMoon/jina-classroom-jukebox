<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>내 신청곡 · Jina Classroom Jukebox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
  </head>
  <body>
    <main class="container py-4 py-md-5 student-shell">
      <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <p class="eyebrow mb-1">AX2 CLASSROOM</p>
          <h1 class="h2 fw-bold mb-1">내 신청곡</h1>
          <p class="text-secondary mb-0">{{ user.name }} 학생, 듣고 싶은 곡을 신청해 보세요.</p>
        </div>
        <button id="logout-button" class="btn btn-outline-light" type="button">로그아웃</button>
      </header>

      <div id="student-alert" class="alert d-none" role="alert"></div>

      <section class="student-card rounded-4 p-4 mb-4 shadow-lg">
        <h2 class="h5 fw-bold mb-3">새 노래 신청</h2>
        <p class="small text-secondary">YouTube 주소는 곡 식별과 검토에만 사용하며 음원을 자동으로 다운로드하지 않습니다.</p>
        <form id="song-request-form" class="row g-3" novalidate>
          <div class="col-12">
            <label for="youtube-url" class="form-label">YouTube 영상 주소</label>
            <input id="youtube-url" name="youtube_url" type="url" class="form-control" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>
          <div class="col-md-7">
            <label for="title" class="form-label">곡 제목</label>
            <input id="title" name="title" class="form-control" maxlength="300" required>
          </div>
          <div class="col-md-5">
            <label for="artist" class="form-label">가수 또는 채널</label>
            <input id="artist" name="artist_or_channel" class="form-control" maxlength="300">
          </div>
          <div class="col-12">
            <label for="comment" class="form-label">신청 메모</label>
            <textarea id="comment" name="comment" class="form-control" rows="2" maxlength="500" placeholder="이 곡을 신청한 이유 등을 적어 주세요. (선택)"></textarea>
          </div>
          <div class="col-12">
            <button id="request-button" class="btn btn-primary" type="submit">신청하기</button>
          </div>
        </form>
      </section>

      <section class="student-card rounded-4 p-4 shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 fw-bold mb-0">신청 내역</h2>
          <button id="refresh-button" class="btn btn-sm btn-outline-light" type="button">새로고침</button>
        </div>
        <div id="request-list" class="request-list" aria-live="polite"></div>
      </section>
    </main>
    <script src="{{ url_for('static', path='/student.js') }}" defer></script>
  </body>
</html>
