<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 회원가입 · AX2 Classroom Jukebox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/styles.css') }}?v=20261117-1" rel="stylesheet">
  </head>
  <body>
    <main class="login-shell container py-5">
      <section class="login-card rounded-4 p-4 p-md-5 shadow-lg mx-auto">
        <p class="eyebrow mb-2">AX2 CLASSROOM</p>
        <h1 class="h2 fw-bold">학생 회원가입</h1>
        <p class="text-secondary">가입 신청 후 관리자가 승인하면 로그인할 수 있습니다.</p>
        <div id="register-alert" class="alert d-none" role="alert"></div>
        <form id="register-form" class="mt-4" novalidate>
          <div class="mb-3"><label class="form-label" for="name">이름</label><input class="form-control form-control-lg" id="name" maxlength="100" required></div>
          <div class="mb-3"><label class="form-label" for="email">이메일</label><input class="form-control form-control-lg" id="email" type="email" autocomplete="username" required></div>
          <div class="mb-4"><label class="form-label" for="password">비밀번호 (8자 이상)</label><input class="form-control form-control-lg" id="password" type="password" autocomplete="new-password" minlength="8" required></div>
          <button id="register-button" class="btn btn-primary btn-lg w-100" type="submit">가입 신청</button>
        </form>
        <p class="text-center mt-4 mb-0"><a href="/login">로그인으로 돌아가기</a></p>
      </section>
    </main>
    <script src="{{ url_for('static', path='/register.js') }}?v=20261117-1" defer></script>
  </body>
</html>
